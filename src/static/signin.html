<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome back</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px 18px;
			color: #172033;
			background: #f5f7fb;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		.shell {
			width: min(100%, 1000px);
			min-height: 620px;
			display: grid;
			grid-template-columns: 43% 57%;
			overflow: hidden;
			background: #fff;
			border-radius: 22px;
			box-shadow: 0 24px 60px rgba(29, 42, 78, .13);
		}
		.hero {
			position: relative;
			overflow: hidden;
			padding: 48px 42px;
			color: #fff;
			background: linear-gradient(145deg, #4338ca, #2563eb);
		}
		.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.1); }
		.hero::before { width: 330px; height: 330px; right: -150px; bottom: -105px; }
		.hero::after { width: 170px; height: 170px; top: -70px; left: -60px; }
		.brand, .hero-copy { position: relative; z-index: 1; }
		.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.3px; }
		.brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: #fff; color: #4338ca; font-size: 18px; }
		.hero-copy { margin-top: 145px; }
		.hero h1 { max-width: 280px; margin: 0 0 16px; font-size: 38px; line-height: 1.1; letter-spacing: -1.4px; }
		.hero p { max-width: 280px; margin: 0; color: #dbeafe; line-height: 1.65; font-size: 15px; }
		.form-panel { width: min(100%, 430px); margin: auto; padding: 44px 32px; }
		.form-panel h2 { margin: 0 0 8px; font-size: 27px; letter-spacing: -.8px; }
		.intro { margin: 0 0 26px; color: #667085; font-size: 14px; }
		.tabs { display: flex; gap: 24px; margin-bottom: 24px; border-bottom: 1px solid #e8ebf1; }
		.tab { appearance: none; padding: 0 2px 11px; border: 0; border-bottom: 2px solid transparent; color: #737b8d; background: transparent; cursor: pointer; font: 600 14px inherit; }
		.tab.active { color: #4338ca; border-color: #4338ca; }
		.socials { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
		.social-btn {
			display: flex; align-items: center; justify-content: center; gap: 8px; height: 45px;
			border: 1px solid #dfe3ea; border-radius: 9px; color: #30394a; background: #fff;
			cursor: pointer; font: 600 13px inherit;
		}
		.social-btn:hover { background: #f8f9fc; border-color: #c4cada; }
		.icon { width: 18px; height: 18px; }
		.divider { display: flex; align-items: center; gap: 12px; margin: 23px 0; color: #99a1b0; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
		.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e8ebf1; }
		.field { display: block; margin-bottom: 15px; color: #344054; font-size: 13px; font-weight: 600; }
		.field input { width: 100%; height: 46px; margin-top: 7px; padding: 0 13px; outline: none; border: 1px solid #dfe3ea; border-radius: 9px; color: #172033; font: 14px inherit; transition: border .2s, box-shadow .2s; }
		.field input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.13); }
		.options { display: flex; align-items: center; justify-content: space-between; margin: 0 0 21px; font-size: 12px; }
		.check { display: flex; align-items: center; gap: 7px; color: #667085; }
		input[type="checkbox"] { accent-color: #4f46e5; }
		a { color: #4f46e5; text-decoration: none; font-weight: 600; }
		.primary { width: 100%; height: 47px; border: 0; border-radius: 9px; color: #fff; background: #4f46e5; box-shadow: 0 7px 14px rgba(79,70,229,.2); cursor: pointer; font: 700 14px inherit; }
		.primary:hover { background: #4338ca; }
		.terms { margin: 17px 0 0; color: #81899a; font-size: 11px; line-height: 1.5; text-align: center; }
		.signup-only { display: none; }
		body.signup .signup-only { display: block; }
		body.signup .signin-only { display: none; }
		@media (max-width: 720px) {
			body { padding: 0; background: #fff; }
			.shell { display: block; min-height: 100vh; border-radius: 0; box-shadow: none; }
			.hero { min-height: 190px; padding: 26px; }
			.hero-copy { margin-top: 36px; }
			.hero h1 { font-size: 27px; margin-bottom: 7px; }
			.hero p { font-size: 13px; }
			.form-panel { padding: 34px 25px; }
		}
	</style>
</head>
<body>
	<main class="shell">
		<section class="hero">
			<div class="brand"><span class="brand-mark">✦</span>acme</div>
			<div class="hero-copy">
				<h1>Everything you need, in one place.</h1>
				<p>Join thousands of teams building better workspaces and making progress together.</p>
			</div>
		</section>
		<section class="form-panel" aria-label="Account access">
			<h2 id="form-title">Welcome back</h2>
			<p class="intro" id="form-intro">Sign in to continue to your workspace.</p>
			<div class="tabs" role="tablist">
				<button class="tab active" type="button" role="tab" aria-selected="true" data-mode="signin">Sign in</button>
				<button class="tab" type="button" role="tab" aria-selected="false" data-mode="signup" >Create account</button>
			</div>
			<div class="socials">
				<button class="social-btn" type="button" aria-label="Continue with Google">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.2c1.9-1.8 3.1-4.4 3.1-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H3v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.2 13.7A6 6 0 0 1 6 12c0-.6.1-1.2.2-1.7V7.7H3A10 10 0 0 0 3 16.3l3.2-2.6Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.9.5 3.9 1.5l2.9-2.9A10 10 0 0 0 3 7.7l3.2 2.6C7 7.8 9.3 6 12 6Z"/></svg>
					Google
				</button>
				<button class="social-btn" type="button" aria-label="Continue with GitHub">
					<svg class="icon" viewBox="0 0 24 24" fill="#172033" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.9.1-.6.4-1.1.6-1.3-2.2-.3-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.3 4.6-4.5 4.9.4.3.7 1 .7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
					GitHub
				</button>
			</div>
			<div class="divider">or continue with email</div>
			<form id="account-form" novalidate>
				<label class="field signup-only">Full name<input type="text" name="name" placeholder="Alex Morgan" autocomplete="name"></label>
				<label class="field">Email address<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label>
				<label class="field signup-only">Mobile number<input type="tel" name="mobile" placeholder="9876543210" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"></label>
				<label class="field">Password<input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required></label>
				<label class="field signup-only">Confirm password<input type="password" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password"></label>
				<div class="options signin-only"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
				<div class="options signup-only"><label class="check"><input type="checkbox" name="agree"> I agree to the terms</label></div>
				<button class="primary" type="submit" id="submit-button" >Sign in</button>
			</form>
			<p class="terms" id="terms-text">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
		</section>
	</main>
	<script>
		console.log("Initializing form behavior.");
		const tabs = document.querySelectorAll('.tab');
		const title = document.getElementById('form-title');
		const intro = document.getElementById('form-intro');
		const submit = document.getElementById('submit-button');
		const form = document.getElementById('account-form');
		tabs.forEach(tab => tab.addEventListener('click', () => {
			const signup = tab.dataset.mode === 'signup';
			document.body.classList.toggle('signup', signup);
			tabs.forEach(item => { item.classList.toggle('active', item === tab); item.setAttribute('aria-selected', item === tab); });
			title.textContent = signup ? 'Create your account' : 'Welcome back';
			intro.textContent = signup ? 'Start your journey with a free account.' : 'Sign in to continue to your workspace.';
			submit.textContent = signup ? 'Sign up' : 'Sign in';
			document.querySelector('[name="password"]').autocomplete = signup ? 'new-password' : 'current-password';
			applyModeState();
		}));
		console.log("Initializing form behavior in progress.");

		const nameInput = document.querySelector('[name="name"]');
		const mobileInput = document.querySelector('[name="mobile"]');
		const agreeCheckbox = document.querySelector('[name="agree"]');
		const emailInput = document.querySelector('[name="email"]');
		const passwordInput = document.querySelector('[name="password"]');
		const confirmPasswordInput = document.querySelector('[name="confirmPassword"]');

		function applyModeState() {
			const signup = document.body.classList.contains('signup');
			const nameField = nameInput?.closest('.field');
			const mobileField = mobileInput?.closest('.field');
			const agreeWrap = agreeCheckbox?.closest('.options');
			const confirmPasswordField = confirmPasswordInput?.closest('.field');

			if (nameInput) nameInput.required = signup;
			if (mobileInput) mobileInput.required = signup;
			if (agreeCheckbox) agreeCheckbox.required = signup;
			if (confirmPasswordInput) confirmPasswordInput.required = signup;
			if (nameField) nameField.style.display = signup ? 'block' : 'none';
			if (mobileField) mobileField.style.display = signup ? 'block' : 'none';
			if (agreeWrap) agreeWrap.style.display = signup ? 'flex' : 'none';
			if (confirmPasswordField) confirmPasswordField.style.display = signup ? 'block' : 'none';

			if (signup) {
				passwordInput.autocomplete = 'new-password';
			} else {
				passwordInput.autocomplete = 'current-password';
			}
		}

		applyModeState();

		form.addEventListener('submit', async function(event) {
			console.log("Form submission intercepted.");
			event.preventDefault();

			const signup = document.body.classList.contains('signup');
			console.log("Form mode determined:", signup);

			if (signup) {
				if (!form.checkValidity()) {
					form.reportValidity();
					console.log('Signup form validation failed');
					return;
				}

				if (passwordInput.value !== confirmPasswordInput.value) {
					confirmPasswordInput.setCustomValidity('Passwords do not match.');
					form.reportValidity();
					confirmPasswordInput.setCustomValidity('');
					return;
				}

				const formData = new FormData(form);
				const payload = {
					name: formData.get('name')?.trim() || '',
					email: formData.get('email')?.trim() || '',
					mobile: formData.get('mobile')?.trim() || '',
					password: formData.get('password') || ''
				};

				console.log("Submitting signup payload:", payload);

				try {
					const response = await fetch('/auth/register', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify(payload)
					});

					if (!response.ok) {
						const errorData = await response.json().catch(() => ({}));
						console.error('Signup failed:', errorData);
						alert('Signup failed. Please check the fields and try again.');
						return;
					}

					const data = await response.json().catch(() => null);
					console.log('Signup successful:', data);
					window.location.href = data.next_url;
					return;
				} catch (error) {
					console.error('Network error during signup:', error);
					alert('Could not connect to the server.');
					return;
				}
			}

			if (!form.checkValidity()) {
				form.reportValidity();
				console.log('Signin form validation failed');
				return;
			}

			console.log("Submitting sign-in payload:", {
				email: emailInput.value,
				password: passwordInput.value
			});

			try {
				const response = await fetch('/auth/login', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({
						email: emailInput.value,
						password: passwordInput.value
					})
				});

				if (!response.ok) {
					const errorData = await response.json().catch(() => ({}));
					console.error('Login failed:', errorData);
					alert('Login failed. Please check your email and password.');
					return;
				}

				const data = await response.json().catch(() => ({}));
				console.log('Login successful:', data);
				window.location.href = '/';
			} catch (error) {
				console.error('Network error during login:', error);
				alert('Could not connect to the server.');
			}
		});
		console.log("Initializing form behavior completed.");
	// document.getElementById('submit-button').addEventListener('click', (event) => {
	// 	// const form = event.target.closest('form');
	// 	// if (form.checkValidity()) {
	// 	// 	form.submit();
	// 	// } else {
	// 	// 	form.reportValidity();
	// 	// }
	// 	window.location.href = "/create_account";
	// 	return;
	// });


		 

	</script>
</body>
</html>
