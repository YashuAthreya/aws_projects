<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In</title>
<style>
  :root { --primary: #1f2937; --accent: #2563eb; --bg: #f4f6fb; --border: #e2e5ee; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); font-family: Inter, 'Segoe UI', Arial, sans-serif;
  }
  .card {
    width: min(100%, 380px); background: #fff; border-radius: 14px; padding: 36px 32px;
    box-shadow: 0 20px 50px rgba(17, 24, 39, .12);
  }
  h1 { margin: 0 0 6px; font-size: 22px; color: var(--primary); }
  p.subtitle { margin: 0 0 24px; color: #6b7280; font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 16px; }
  input {
    width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  button {
    width: 100%; margin-top: 8px; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .error-msg { color: #b3261e; font-size: 13px; margin-top: 14px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin Sign In</h1>
    <p class="subtitle">Restricted access. Enter your admin credentials to continue.</p>
    <form id="adminLoginForm">
      <label>Admin name
        <input type="text" id="adminName" name="adminName" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="adminPassword" name="adminPassword" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign In</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      const admin_name = document.getElementById('adminName').value.trim();
      const admin_password = document.getElementById('adminPassword').value;

      try {
        const response = await fetch('/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_name, admin_password })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          errorMsg.textContent = errorData.detail || 'Invalid admin name or password.';
          return;
        }

        window.location.href = '/static/admin_dashboard.html';
      } catch (error) {
        console.error('Admin login failed:', error);
        errorMsg.textContent = 'Could not connect to the server.';
      }
    });
  </script>
</body>
</html>
